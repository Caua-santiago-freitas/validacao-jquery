<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação com JQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class = "bg-light">

    <div class = "container mt-5">
        <div class = "card shadow">
            <div class = "card-header bg-primary text-white">
                <h1 class = "h4 mb-0">Cadastro</h1>
            </div>

            <div class = "card-body">

                <!-- Aqui vamos criar o form -->

                <form id="form01">
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label form="nome" class="form-label">Nome Completo</label>
                            <input type="text" class="form-control" id="nome" placeholder="Ex: Cauã Santiago">
                            <div class="invalid-feedback"> Informe o seu nome completo</div>
                            <div class="valid-feedback">Válido</div>
                        </div>

                        <div class="col-md-8 mb-3">
                            <label form="cpf" class="form-label">CPF</label>
                            <input type="text" class="form-control" id="cpf" placeholder="Ex: 444.444.444-44">
                            <div class="invalid-feedback"> Informe o seu CPF</div>
                            <div class="valid-feedback">Válido</div>
                        </div>

                        <div class="col-md-8 mb-3">
                            <label form="email" class="form-label">E-mail</label>
                            <input type="text" class="form-control" id="email" placeholder="Ex: User@gmail.com">
                            <div class="invalid-feedback"> Informe o seu e-mail</div>
                            <div class="valid-feedback">Válido</div>
                        </div>

                        <div class="col-md-8 mb-3">
                            <label form="telefone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone" placeholder="Ex: (44) 12345-6789">
                            <div class="invalid-feedback"> Informe o seu número de telefone</div>
                            <div class="valid-feedback">Válido</div>
                        </div>

                </form>
                <!-- Aqui mostra/simula o envio do formulário -->
                <div id="resultado" class="alert alert-success mt-4 d-none">

                <button>Cadastrar</button>

                </div>
            </div>
        </div>
    </div>
    
    <!-- JQuery -->
    <script src="https://code.JQuery.com/JQuery-3.7.1.min.js"></script>

    <!-- JQuery Validation-->
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>

    <!-- Script da página -->
     <script src="./script.js"></script>
</body>
</html>
